name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Check newly published RUSTSEC advisories and newly stabilized compiler
  # lints even when the repository has had no recent push.
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC

# Cancel superseded runs on the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: short

jobs:
  features:
    name: local feature E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - name: Real CLI and fixture harness in Docker
        run: bash tests/e2e/features/run.sh

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      # NOTE: pinning the `stable` branch ref freezes the toolchain channel
      # to whatever "stable" resolved to on the pin date, rather than
      # tracking the rolling `stable` channel. This is a supply-chain pin,
      # not the minimum supported Rust version.
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30  # stable (branch)
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --locked --workspace --no-fail-fast

      - name: cargo build --release
        run: cargo build --locked --release

      - name: Upload release binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ironlint-${{ matrix.os }}
          path: target/release/ironlint
          retention-days: 1

      - name: IronLint dogfood (.ironlint.yml on own source)
        if: hashFiles('.ironlint.yml') != ''
        run: PATH="$(pwd)/target/release:${PATH}" bash scripts/ci-dogfood.sh

  # Verify that the workspace compiles for Windows. Runtime checks require a
  # POSIX `sh`, and Unix process handling is target-scoped, so this job remains
  # compile-only.
  windows:
    name: windows (compile only)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      # NOTE: pinning the `stable` branch ref freezes the toolchain channel
      # to whatever "stable" resolved to on the pin date, rather than
      # tracking the rolling `stable` channel. This is a supply-chain pin,
      # not the minimum supported Rust version.
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30  # stable (branch)

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          shared-key: windows

      - name: cargo build --locked (compile only)
        run: cargo build --locked --workspace

  coverage:
    name: coverage gate (≥80% per file)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      # NOTE: pinning the `stable` branch ref freezes the toolchain channel
      # to whatever "stable" resolved to on the pin date, rather than
      # tracking the rolling `stable` channel. This is a supply-chain pin,
      # not the minimum supported Rust version.
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30  # stable (branch)
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          shared-key: coverage

      - uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419  # v2.82.7
        with:
          tool: cargo-llvm-cov

      - name: Per-file coverage gate
        run: bash scripts/ci-coverage.sh

  # Fail on known RUSTSEC advisories, disallowed licenses, and dependency
  # policy violations configured in deny.toml.
  deny:
    name: cargo-deny (advisories, licenses, bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe  # v2.0.20
        with:
          # The action defaults `arguments` to `--all-features`; override it
          # to match what's verified locally (`cargo deny check advisories
          # licenses bans`, no `--all-features` — deny.toml's [graph] section
          # intentionally checks the workspace as it actually ships).
          arguments: ""
          command: check
          command-arguments: "advisories licenses bans"

  # Build and test on the minimum Rust version declared in Cargo.toml so
  # source-install compatibility is verified continuously.
  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30  # stable (branch)
        with:
          toolchain: "1.88"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          shared-key: msrv

      - name: cargo build --locked (MSRV)
        run: cargo build --locked --workspace

      - name: cargo test --locked (MSRV)
        run: cargo test --locked --workspace --no-fail-fast

  pi-adapter:
    name: pi adapter
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: ironlint-ubuntu-latest
          path: target/release

      - run: chmod +x target/release/ironlint

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"

      - name: Install dev deps
        working-directory: adapters/pi
        run: npm ci

      - name: TypeScript type-check
        working-directory: adapters/pi
        run: npx tsc --noEmit

      - name: Extension integration test
        run: PATH="$(pwd)/target/release:${PATH}" node --experimental-strip-types --test adapters/pi/test/*.test.ts

  # One lane for the supported Pi adapter contract and its pinned fixtures.
  adapters:
    name: adapters (contract suites + fixtures)
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30  # stable (branch)
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          shared-key: adapters

      - uses: actions/setup-node@0d7a53ec77e4e27c1e912cfb74255c5ea5a7d57e  # v4.1.0
        with:
          node-version: 22

      - name: Install adapter dev deps
        working-directory: adapters/pi
        run: npm ci

      - name: Run every adapter contract suite
        run: bash scripts/ci-adapters.sh
