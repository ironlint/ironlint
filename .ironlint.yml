version: 1

execution:
  timeout_secs: 60
  total_timeout_secs: 600

checks:
  rustfmt:
    files: ["*.rs", "Cargo.toml"]
    on: [change, accept]
    run: cargo fmt --all --check

  clippy:
    run: cargo clippy --locked --all-targets -- -D warnings

  tests:
    run: cargo test --locked

  no-debug-macros:
    run: "! grep -RInE 'todo!\\(|unimplemented!\\(|dbg!\\(' crates --include='*.rs'"
