[package]
name = "ironlint-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_yaml.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
sha2.workspace = true
globset.workspace = true
chrono.workspace = true
wait-timeout = "0.2"
fs4.workspace = true

# `nix` provides Unix process-group and signal handling for bounded command
# execution. Keep it target-scoped so the core crate can compile on Windows.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["fs", "signal", "process"] }

[dev-dependencies]
tempfile.workspace = true
insta.workspace = true
serde_json.workspace = true
proptest.workspace = true

[lints]
workspace = true
